[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hrrr-mesoanalysis"
version = "0.1.0"
description = "High-resolution mesoscale analysis system powered by metrust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "metrust>=0.1.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "herbie-data>=2024.1",
    "cartopy>=0.21",
    "matplotlib>=3.7",
    "requests",
]

[project.urls]
Homepage = "https://github.com/FahrenheitResearch/hrrr-mesoanalysis"

[tool.setuptools.packages.find]
include = ["mesoanalysis*"]
