[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mesoanalysis"
version = "1.0.0"
description = "Drop-in mesoscale analysis engine for NWP model sites — HRRR, RAP, NAM surface obs correction with Barnes objective analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "weather",
    "mesoanalysis",
    "severe weather",
    "CAPE",
    "SPC",
    "NWP",
    "HRRR",
    "RAP",
    "NAM",
    "Barnes",
    "objective analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]
dependencies = [
    "metrust>=0.3.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "herbie-data>=2024.1",
    "cartopy>=0.21",
    "matplotlib>=3.7",
    "requests",
    "Pillow>=9.0",
    "pandas",
]

[project.optional-dependencies]
web = ["flask"]

[project.scripts]
mesoanalysis = "mesoanalysis.__main__:main"

[project.urls]
Homepage = "https://github.com/FahrenheitResearch/hrrr-mesoanalysis"
Repository = "https://github.com/FahrenheitResearch/hrrr-mesoanalysis"
Issues = "https://github.com/FahrenheitResearch/hrrr-mesoanalysis/issues"

[tool.setuptools.packages.find]
include = ["mesoanalysis*"]
